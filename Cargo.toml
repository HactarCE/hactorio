[workspace]
members = ["crates/hactorio", "crates/hactorio-core", "crates/hactorio-data"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
eframe = "0.37.0"
egui = "0.37.0"
hactorio-core = { path = "crates/hactorio-core" }
hactorio-data = { path = "crates/hactorio-data" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sublime_fuzzy = "0.7"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
