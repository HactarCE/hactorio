[package]
name = "hactorio"
description = "Hactar's Factorio Calculator"
version.workspace = true
edition.workspace = true
authors = ["Andrew Farkas"]
repository = "https://github.com/HactarCE/hactorio"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[dependencies]
eframe.workspace = true
fontdb = "0.23"
egui.workspace = true
hactorio-core.workspace = true
hactorio-data.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
sublime_fuzzy.workspace = true

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["snapshot", "wgpu"] }
